<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sqlite-live demo</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d10;
        --panel: #0f1318;
        --line: #202730;
        --text: #e8ecf1;
        --muted: #8b96a5;
        --accent: #3ddc97;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .wrap {
        max-width: 1040px;
        margin: 0 auto;
        padding: 44px 24px 72px;
      }

      .top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
      }

      h1 {
        font-size: 19px;
        letter-spacing: -0.01em;
        margin: 0;
      }

      .sub {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
        margin: 7px 0 0;
        max-width: 60ch;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        padding: 5px 11px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: #12161b;
        color: var(--muted);
        text-transform: lowercase;
        flex: none;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
      }

      .pill.live {
        color: var(--text);
        border-color: #23503f;
      }

      .pill.live .dot {
        background: var(--accent);
        box-shadow: 0 0 10px var(--accent);
      }

      .composer {
        display: flex;
        gap: 8px;
        margin: 26px 0 18px;
        flex-wrap: wrap;
      }

      input,
      select,
      button {
        font: inherit;
        font-size: 13px;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: #10151a;
        color: var(--text);
        padding: 9px 12px;
        outline: none;
      }

      input {
        flex: 1;
        min-width: 180px;
      }

      input:focus,
      select:focus {
        border-color: #2f6f57;
        box-shadow: 0 0 0 3px rgba(61, 220, 151, 0.08);
      }

      button {
        cursor: pointer;
        background: #17342a;
        border-color: #23503f;
        color: #c9f7e3;
        font-weight: 500;
      }

      button:disabled {
        opacity: 0.45;
        cursor: default;
      }

      button.ghost {
        background: transparent;
        border-color: var(--line);
        color: var(--muted);
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      @media (max-width: 760px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
        padding: 14px 14px 6px;
        transition:
          border-color 220ms ease,
          box-shadow 220ms ease;
      }

      .panel.pulse {
        border-color: #2f6f57;
        box-shadow: 0 0 0 3px rgba(61, 220, 151, 0.07);
      }

      .panel header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        padding: 0 2px 10px;
      }

      h2 {
        font-size: 13px;
        font-weight: 600;
        margin: 0;
        letter-spacing: 0.01em;
      }

      .meta {
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        min-height: 72px;
      }

      li {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 9px 2px;
        border-top: 1px solid #171d24;
        font-size: 13px;
      }

      .id {
        color: #5d6978;
        font-variant-numeric: tabular-nums;
        font-size: 11px;
        width: 30px;
        flex: none;
      }

      .name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .org {
        color: var(--muted);
        font-size: 11px;
        flex: none;
      }

      .empty,
      .error {
        font-size: 12px;
        color: var(--muted);
        padding: 4px 2px 10px;
        margin: 0;
      }

      .error {
        color: #ff8a8a;
      }

      footer {
        margin-top: 22px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.7;
      }

      code {
        display: block;
        margin-top: 6px;
        padding: 10px 12px;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: #0d1116;
        color: #b9c4d2;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
        overflow-x: auto;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/client.js"></script>
  </body>
</html>
