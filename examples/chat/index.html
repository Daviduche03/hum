<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hum chat</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d10;
        --panel: #0f1318;
        --panel-2: #12171d;
        --line: #202730;
        --text: #e8ecf1;
        --muted: #8b96a5;
        --dim: #5d6978;
        --accent: #3ddc97;
        --mine: #17342a;
      }

      * { box-sizing: border-box; }

      html, body, #root { height: 100%; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
      }

      .app {
        display: grid;
        grid-template-columns: 232px 1fr;
        height: 100%;
        max-width: 1180px;
        margin: 0 auto;
        border-left: 1px solid var(--line);
        border-right: 1px solid var(--line);
      }

      @media (max-width: 720px) {
        .app { grid-template-columns: 1fr; }
        .sidebar { display: none; }
      }

      /* ------------------------------------------------------------ sidebar */

      .sidebar {
        border-right: 1px solid var(--line);
        background: var(--panel);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .brand {
        padding: 16px 16px 12px;
        border-bottom: 1px solid var(--line);
      }

      .brand h1 {
        margin: 0;
        font-size: 14px;
        letter-spacing: 0.02em;
      }

      .brand p {
        margin: 4px 0 0;
        font-size: 11px;
        color: var(--muted);
      }

      .rooms {
        list-style: none;
        margin: 0;
        padding: 8px;
        overflow-y: auto;
        flex: 1;
      }

      .rooms button {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 10px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 13px;
        text-align: left;
        cursor: pointer;
      }

      .rooms button:hover { background: var(--panel-2); color: var(--text); }

      .rooms button[aria-current="true"] {
        background: #16211c;
        color: var(--text);
        box-shadow: inset 0 0 0 1px #23503f;
      }

      .badge {
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 999px;
        background: var(--accent);
        color: #06231a;
        font-size: 11px;
        font-weight: 600;
        display: grid;
        place-items: center;
      }

      .who {
        border-top: 1px solid var(--line);
        padding: 12px 14px;
        display: grid;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
      }

      .who select {
        width: 100%;
        font: inherit;
        font-size: 12px;
        padding: 6px 8px;
        border-radius: 7px;
        border: 1px solid var(--line);
        background: #10151a;
        color: var(--text);
      }

      /* ------------------------------------------------------------- thread */

      .thread {
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--bg);
      }

      .thread-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
      }

      .thread-head h2 { margin: 0; font-size: 14px; }
      .thread-head .hint { margin: 3px 0 0; font-size: 11px; color: var(--muted); }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: #12161b;
        color: var(--muted);
        flex: none;
      }

      .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
      .pill.live { color: var(--text); border-color: #23503f; }
      .pill.live .dot { background: var(--accent); box-shadow: 0 0 10px var(--accent); }

      .scroll {
        flex: 1;
        overflow-y: auto;
        padding: 16px 20px 8px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .more {
        align-self: center;
        margin: 2px 0 14px;
        font: inherit;
        font-size: 11px;
        padding: 5px 12px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }

      .more:hover { color: var(--text); border-color: #2f6f57; }

      .msg {
        display: grid;
        grid-template-columns: 42px 1fr;
        gap: 10px;
        padding: 5px 0;
      }

      .msg .avatar {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 600;
        color: #06231a;
        background: #3ddc97;
        align-self: start;
      }

      .msg.mine .avatar { background: #2f6f57; color: #d7f9ea; }

      .msg .meta {
        display: flex;
        align-items: baseline;
        gap: 8px;
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 2px;
      }

      .msg .meta strong { color: var(--text); font-weight: 600; font-size: 12px; }
      .msg .meta time { color: var(--dim); font-variant-numeric: tabular-nums; }

      .msg .body {
        font-size: 13.5px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .empty, .error {
        color: var(--muted);
        font-size: 12px;
        text-align: center;
        padding: 36px 12px;
        margin: 0;
      }

      .error { color: #ff8a8a; }

      .composer {
        display: flex;
        gap: 8px;
        padding: 12px 20px 18px;
        border-top: 1px solid var(--line);
      }

      .composer input {
        flex: 1;
        font: inherit;
        font-size: 13px;
        padding: 10px 12px;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: #10151a;
        color: var(--text);
        outline: none;
      }

      .composer input:focus {
        border-color: #2f6f57;
        box-shadow: 0 0 0 3px rgba(61, 220, 151, 0.08);
      }

      .composer button {
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        padding: 10px 16px;
        border-radius: 9px;
        border: 1px solid #23503f;
        background: #17342a;
        color: #c9f7e3;
        cursor: pointer;
      }

      .composer button:disabled { opacity: 0.45; cursor: default; }

      .foot {
        padding: 0 20px 14px;
        font-size: 11px;
        color: var(--dim);
        line-height: 1.6;
      }

      .foot code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #10151a;
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 1px 5px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script id="me" type="application/json">__ME_JSON__</script>
    <script type="module" src="/client.js"></script>
  </body>
</html>
